<!-- ==================================================
     SOFITURISMO - CONFIGURACIÓN GENERAL
================================================== -->

<link
    rel="icon"
    href="{{ url_for('static', filename='favicon.svg') }}"
    type="image/svg+xml"
>

<link
    rel="manifest"
    href="{{ url_for('static', filename='site.webmanifest') }}"
>

<meta
    name="theme-color"
    content="#082d50"
>

<meta
    name="application-name"
    content="Sofiturismo"
>

<meta
    name="apple-mobile-web-app-title"
    content="Sofiturismo"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
>

<meta
    property="og:site_name"
    content="Sofiturismo"
>

<meta
    property="og:type"
    content="website"
>

<meta
    property="og:image"
    content="{{ url_for('static', filename='img/portada.png', _external=True) }}"
>
